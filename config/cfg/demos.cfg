//demos for recording
//created by sketchek, reimagined by me :D
//2020


//masterbind

bind ' "record fix; stop; ds_record"


 
							//explanation:
							//this is what you use to record a new demo. you can use this to spy check too,
							//since it has ds_record after it, it will:
	
							//record a demo
							//stop it
							//record a new one, hence, a refresh of the game with no repercussions



//clip bind

bind downarrow "ds_mark"
bind uparrow "ds_mark"

							//explanation
							//this is like a "clip" button. this button makes the current demo being recorded actually save as a demo file.
 							//feel free to press the new demo bind as much as you want, it wont clog up. 
							//(however dont actually spam it, ive had problems with it in the past if you are literally spamming)



//demo config

ds_enable "2"					//puts a message in chat saying the demo is being recorded
ds_dir "demos"					//this is your directory, (where the demos are saved) you can change this however you like
ds_min_streak "1000.000000"			//keep this at 1000, minimum number of kills to trigger an autoclip (1000 kills)
ds_kill_delay "1000.000000"			//keep this at 1000, maximum time between kills to trigger an autoclip (approx. 5.55 minutes.)
ds_screens "0"					//toggles taking a screenshot after each match with a SAVED demo, keep it off
ds_autodelete "1"					//very important, having this set to 1 will automatically delete any demo currently being recorded UNLESS the ds_mark bind has been pressed.

alias demonew "ds_stop; ds_record"

//additional notes
//i suggest recording a new demo (downarrow) every life to minimize the demo file size, makes it easier to find the tick you want. 
//make sure that after you ds_mark, you record a new demo. this will seperate any clips within the demo, into their own demo files.

